<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>申论每日晨报 · 看板</title>
<meta name="description" content="每日人民日报热点 · 六大主题素材库 · 申论金句与数据 · 备考资料中心">
<meta name="theme-color" content="#0e1422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <!-- 报头 -->
  <header class="masthead">
    <h1>申论晨报</h1>
    <div class="date" id="mastheadDate">-</div>
  </header>

  <!-- 顶部状态条 -->
  <div class="topbar">
    <span>累计 <b id="totalCount">-</b> 条 · <b id="themeCount">-</b> 主题</span>
    <span><b id="updatePill">-</b> 更新</span>
    <button id="installBtn" style="display:none">添加到桌面</button>
  </div>

  <!-- 【今日】 -->
  <div class="section active" id="sec-today">
    <div id="todayContent"></div>
  </div>

  <!-- 【主题库】 -->
  <div class="section" id="sec-themes">
    <div class="sec-head"><h2>主题素材库</h2></div>
    <div class="grid" id="themeGrid"></div>
  </div>

  <!-- 【日历】 -->
  <div class="section" id="sec-calendar">
    <div class="sec-head"><h2>每日回溯</h2></div>
    <div class="tl" id="dailyList"></div>
  </div>

  <!-- 【笔记】 -->
  <div class="section" id="sec-notes">
    <div class="sec-head"><h2>时政笔记</h2></div>
    <div class="tl" id="noteTimeline"></div>
    <div class="sec-head" style="margin-top:28px"><h2>重要讲话</h2></div>
    <div id="speechList"></div>
  </div>

  <!-- 【搜索】 -->
  <div class="section" id="sec-search">
    <div class="sec-head"><h2>全库检索</h2></div>
    <div class="search-box"><input id="q" type="search" placeholder="🔍 搜金句 / 政策 / 数据 / 主题，如：三北、家庭医生、政绩观、1.4万亿斤"></div>
    <div id="searchCount" style="font-size:12px;color:var(--ink-3);margin-bottom:10px"></div>
    <div id="searchRes"></div>
  </div>

</div>

<!-- 底部固定Tab栏 -->
<nav class="bottom-nav" id="bottomNav">
  <button data-sec="today" class="active"><span class="ico">📰</span><span>今日</span></button>
  <button data-sec="themes"><span class="ico">🗂</span><span>主题</span></button>
  <button data-sec="calendar"><span class="ico">📅</span><span>日历</span></button>
  <button data-sec="notes"><span class="ico">📓</span><span>笔记</span></button>
  <button data-sec="search"><span class="ico">🔍</span><span>搜索</span></button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
